project_id = "aperture"

[api]
enabled = true
port = 54321
# app_private is deliberately ABSENT. PostgREST cannot reach it at all,
# so even a badly-written RLS policy in `public` cannot expose KYC data
# or raw serial numbers. Defence in depth — see SRS threat T-2.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your APERTURE code is {{ .Code }}. It expires in 10 minutes."

[storage]
enabled = true
file_size_limit = "15MiB"
